# Versão entregue de cada módulo do CitizenTech.
# O gate (scripts/gate.py) só gera evidência se cada pasta irmã estiver exatamente
# no commit abaixo. Mudou algum módulo? Atualize o commit aqui, rode o gate de novo
# e registre o motivo no histórico deste repositório.

modulos:
  genai:
    repositorio: citizentech-fiap/citizentech-genai
    pasta: ../genAI
    disciplina: Generative AI & Advanced Nets
    commit: e3f65ddf761b53605e0e354a85a53e5c8cad29e7
    data_commit: 2026-11-09
    testes:
      comando: [python, -m, unittest, discover, -s, tests, -q]
      ambiente: {CITIZEN_RAG_TEST_BACKEND: hashing}
    conjuntos_referencia:
      - eval/perguntas.jsonl
      - eval/perguntas_validacao.jsonl
      - data/corpus/servicos.jsonl

  rpa:
