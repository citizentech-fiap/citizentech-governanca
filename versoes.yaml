# Versão entregue de cada módulo do CitizenTech.
# O gate (scripts/gate.py) só gera evidência se cada pasta irmã estiver exatamente
# no commit abaixo. Mudou algum módulo? Atualize o commit aqui, rode o gate de novo
# e registre o motivo no histórico deste repositório.

modulos:
