id: MC-03
nome: Perda estimada de safra por município
versao: 2.0.0
modulo: dashboard
nome_projeto: CitizenTech
responsavel_negocio: Ricardo de Paiva Melo (Metric Owner)
responsavel_tecnico: Luís Fernando de Oliveira Salgado
data_criacao: 2026-11-13
revisao: RFC-03 (perda relativa à normal 1991-2020)

caso: >
  O painel estima, para cada município do semiárido, a perda de safra causada pela falta de chuva e
  usa essa estimativa para sugerir onde o gestor deve pedir vistoria ou chamar agricultores para o
  Garantia-Safra. O Garantia-Safra usa o critério oficial de perda de 40%. Este contrato fixa a
  fórmula, o que fica de fora e como a estimativa é conferida contra a perda real.

objetivo: >
  Que a estimativa de perda tenha um único cálculo, conferido todo ano contra a produção real do IBGE,
  e que nenhuma tela recalcule o número por conta própria.

indicador:
  chave: perda_estimada_pct
  chave_controle: acuracia_milho
  nome: Perda estimada de produção por município e safra (%)
  formula: >
    100 x Ky x (1 - ISNA_ano / ISNA_normal), limitado a 0 e 100. ISNA = ETa / ETc, com
    ETc = Kc x ET0 e ETa = min(ETc, 0,8 x chuva), somados no mesmo período da safra para o ano e
    para a normal 1991-2020 do município. Milho: Ky 1,25 e Kc 0,85. Feijão: Ky 1,15 e Kc 0,80.
  elegibilidade: >
    Municípios do semiárido do catálogo do painel (23), culturas milho e feijão, safra de janeiro a
    junho. Antes de 1º de março o painel mostra só o sinal de chuva, sem estimar perda.
  baseline: 0.581
  baseline_origem: fórmula anterior ao RFC-03 recalculada sobre os mesmos dados, em evidencias/rfc03_ponte_series.md
  meta: 0.60
  meta_descricao: acerto do critério de 40% contra o IBGE no milho, cultura principal do painel
  atualizacao: diariamente durante a safra (dados de chuva) e uma vez por ano no placar, quando o IBGE publica a PAM
  fonte: dashboard/pipelines/risco.py e dashboard/pipelines/realidade.py (Open-Meteo ERA5 e IBGE SIDRA 1612)

qualidade:
  - chave: acuracia_milho
    nome: Acerto do critério de 40% contra a perda real do IBGE, milho
    limite: ">= 0.60"
  - chave: acuracia_feijao
    nome: Acerto do critério de 40% contra a perda real do IBGE, feijão
    limite: ">= 0.55"
  - chave: spearman_milho
    nome: Correlação de postos entre perda estimada e real, milho
    limite: ">= 0.40"
  - chave: sensibilidade_milho
    nome: Perdas reais de 40% ou mais que o painel sinaliza, milho
    limite: ">= 0.60"
  - chave: sensibilidade_feijao
    nome: Perdas reais de 40% ou mais que o painel sinaliza, feijão
    limite: ">= 0.60"
  - chave: especificidade_milho
    nome: Safras sem perda de 40% que o painel reconhece como tal, milho
    limite: ">= 0.60"
  - chave: invariante_faixa
    nome: Toda estimativa entre 0 e 100
    limite: "== 1"

alertas:
  - metrica: invariante_faixa
    operador: "<"
    valor: 1
    nivel: critico
    acao: Bloquear a versão. Estimativa fora da faixa indica erro de cálculo.
  - metrica: acuracia_milho
    operador: "<"
    valor: 0.60
    nivel: alerta
    acao: Revisar a calibração e avisar o gestor no painel.
  - metrica: acuracia_feijao
    operador: "<"
    valor: 0.55
    nivel: alerta
    acao: Revisar a calibração e avisar o gestor no painel.
  - metrica: sensibilidade_milho
    operador: "<"
    valor: 0.60
    nivel: alerta
    acao: >
      O painel deixa de sinalizar parte das perdas reais. Orientar o gestor a não tratar a ausência de
      alerta como prova de que não houve perda e manter a inscrição aberta a todos os municípios.
  - metrica: sensibilidade_feijao
    operador: "<"
    valor: 0.60
    nivel: alerta
    acao: >
      O painel deixa de sinalizar parte das perdas reais. Orientar o gestor a não tratar a ausência de
      alerta como prova de que não houve perda e manter a inscrição aberta a todos os municípios.

monitoramento: >
  metricas.py recalcula o placar com o código do próprio painel. drift.py compara a chuva de cada
  safra com o histórico e mostra se o acerto cai quando a distribuição muda.
